[package]
name = "hokum"
version = "0.0.1"
edition.workspace = true
license.workspace = true
description = "Hokum (hokum.app): a freedesktop notification daemon drawn with Rune on a Wayland layer surface."

[[bin]]
name = "hokum"
path = "src/main.rs"

[dependencies]
rune = { path = "../../crates/rune" }
rune-kit = { path = "../../crates/rune-kit" }
rune-theme-opencode = { path = "../../themes/opencode" }
zbus = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
